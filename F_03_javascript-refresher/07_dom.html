<!DOCTYPE html>
<html>
<head><title>Meeting the Browser DOM</title></head>
<body>

<button id="changeColorBtn">Change Background</button>
  <p id="message">This paragraph will update in 2 seconds.</p>
 
  <script>
    const button = document.getElementById("changeColorBtn");
    button.addEventListener("click", () => {
      const color = prompt("Which color do you prefer?");
      document.body.style.backgroundColor = color;
    });
 
    const message = document.getElementById("message");
    setTimeout(() => {
      message.textContent = "Done! Updated last 2 sec!";
    }, 2000);
  </script>
</body>
</html>
